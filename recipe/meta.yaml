{% set name = "diff-cover" %}
{% set version = "10.4.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_')}}-{{ version }}.tar.gz
  sha256: 0ec566955c9ee7da2f6cc48fa16fac7f97ad1fc4e50a887ffb9cfe5eb1e831df

build:
  number: 0
  entry_points:
    - diff-cover = diff_cover.diff_cover_tool:main
    - diff-quality = diff_cover.diff_quality_tool:main
  script: {{ PYTHON }} -m pip install .  -vv --no-deps --no-build-isolation
  skip: true  # [py<310]

requirements:
  host:
    - pip
    - python
    - poetry-core >=1.0.7
  run:
    - python
    - pygments >=2.19.1,<3.0.0
    - jinja2 >=2.7.1
    - pluggy >=0.13.1,<2
    - chardet >=3.0.0
  run_constrained:
    - tomli >=1.2.1

test:
  source_files:
    - tests
  requires:
    - pip
    - pytest
    - pytest-mock
    - flake8
    - pylint
    - pytest-cov
    - pycodestyle
    - pyflakes
    - pydocstyle
    - black
  imports:
    - diff_cover
    - diff_cover.violationsreporters
  commands:
    - pip check
    - diff-cover --help
    - diff-quality --help
    # Skipping test_get_src_path_clover cause it's using `datadir` package we don't supply
    # Skipping tests for windows cause upstream doesn't support them
    - pytest -v -k "not test_get_src_path_clover" tests  # [not win]

about:
  home: https://github.com/Bachmann1234/diff-cover
  dev_url: https://github.com/Bachmann1234/diff-cover
  doc_url: https://github.com/Bachmann1234/diff-cover
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  summary: Automatically find diff lines that need test coverage.
  description: Automatically find diff lines that need test coverage.

extra:
  recipe-maintainers:
    - nicoddemus
